<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Landon &amp; Winnie">
<meta name="application-name" content="Landon &amp; Winnie">
<meta name="theme-color" content="#1b1442">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Landon and Winnie: Journey to the Stars</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1b1442; overflow: hidden; position: fixed;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: none;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; touch-action: none; outline: none; }
  #safe {
    position: fixed; pointer-events: none; visibility: hidden;
    left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; color: #fff3c4;
    font: 800 28px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 40%, #3b2b8a, #1b1442 70%);
    transition: opacity .4s;
  }
  #boot .dot { width: 18px; height: 18px; border-radius: 50%; background: #ffd75e; animation: b 0.9s infinite alternate ease-in-out; display: inline-block; margin: 0 6px; }
  #boot .dot:nth-child(2) { animation-delay: .15s; } #boot .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes b { from { transform: translateY(0) scale(1); } to { transform: translateY(-16px) scale(1.15); } }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: #1b1442; color: #fff3c4; z-index: 10; text-align: center;
    font: 800 30px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  #rotate .pad { width: 90px; height: 124px; border: 8px solid #fff3c4; border-radius: 16px; margin-bottom: 28px; animation: r 2s infinite ease-in-out; }
  @keyframes r { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="safe"></div>
<div id="boot"><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div>Getting the rocket ready…</div></div>
<div id="rotate"><div class="pad"></div><div>Turn your iPad sideways!</div></div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
